# Borrado de cuenta dentro de la app (requisito de Apple/Google).
appId: ${APP_ID}
env:
  APP_ID: com.bocadoapp.bocado
---
- runFlow: subflows/onboarding.yaml
- tapOn:
    id: tab-profile
# centerElement keeps the row clear of the floating tab bar before tapping it.
- scrollUntilVisible:
    element:
      id: profile-privacy
    centerElement: true
- tapOn:
    id: profile-privacy
- scrollUntilVisible:
    element:
      id: delete-account
    centerElement: true
- tapOn:
    id: delete-account
- tapOn:
    id: delete-confirm-input
- inputText: 'ELIMINAR'
- hideKeyboard
- tapOn:
    id: delete-confirm
- tapOn: 'Eliminar'
- extendedWaitUntil:
    visible:
      id: welcome-guest
    timeout: 15000
