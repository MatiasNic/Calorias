# Plan gratis: 3 fotos por día; la cuarta abre el paywall contextual.
appId: ${APP_ID}
env:
  APP_ID: com.bocadoapp.bocado
---
- runFlow: _onboarding.yaml
- repeat:
    times: 3
    commands:
      # The center tab opens voice logging; the camera is reached by link.
      - openLink: 'bocado://scan'
      - runFlow:
          when:
            visible: 'Permitir cámara'
          commands:
            - tapOn: 'Permitir cámara'
            - tapOn:
                text: '(While using the app|Mientras la app está en uso|Only this time|Solo esta vez)'
                optional: true
      - tapOn:
          id: scan-capture
      - extendedWaitUntil:
          visible:
            id: review-save
          timeout: 15000
      - tapOn:
          id: review-save
# The center tab opens voice logging; the camera is reached by link.
- openLink: 'bocado://scan'
- tapOn:
    id: scan-capture
- extendedWaitUntil:
    visible: 'Seguí escaneando sin límites'
    timeout: 15000
