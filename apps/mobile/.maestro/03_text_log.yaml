# Registro por texto (IA simulada) → revisión → guardar.
appId: ${APP_ID}
env:
  APP_ID: com.bocadoapp.bocado
---
- runFlow: subflows/onboarding.yaml
# Today's "¿Qué comiste?" bar: its text side opens the text log (QuickActions is no longer on Today).
- tapOn:
    id: log-bar-text
- tapOn:
    id: text-log-input
- inputText: 'dos empanadas y una coca zero'
- hideKeyboard
- tapOn:
    id: text-log-analyze
- extendedWaitUntil:
    visible:
      id: review-save
    timeout: 10000
- assertVisible: 'Empanada.*'
- tapOn:
    id: review-save
- assertVisible:
    id: today-screen
