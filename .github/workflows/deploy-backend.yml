name: Deploy backend + real APK

# Runs scripts/deploy-backend.sh against the Supabase project (GitHub runners can reach Postgres,
# unlike sandboxed environments), then builds a test APK with real AI/backend
# (EXPO_PUBLIC_USE_MOCKS=false) and publishes it as a GitHub Release. See docs/SEMANA_DE_PRUEBA.md.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD, BOCADO_ANTHROPIC_API_KEY
#   optional: USDA_FDC_API_KEY, REVENUECAT_WEBHOOK_SECRET, AI_ALERT_WEBHOOK_URL
on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Run migrations, seed, secrets and Edge Functions (off = only read the public keys)'
        type: boolean
        default: true
      build_apk:
        description: 'Also build and publish the real-mode APK'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Supabase backend
    runs-on: ubuntu-latest
    outputs:
      supabase_url: ${{ steps.keys.outputs.supabase_url }}
      anon_key: ${{ steps.keys.outputs.anon_key }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BOCADO_ANTHROPIC_API_KEY: ${{ secrets.BOCADO_ANTHROPIC_API_KEY }}
      USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
      REVENUECAT_WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
      AI_ALERT_WEBHOOK_URL: ${{ secrets.AI_ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy (migrations, seed, secrets, Edge Functions)
        if: ${{ inputs.deploy_backend }}
        run: ./scripts/deploy-backend.sh
      - name: Public values for the app (URL and anon key are not secret)
        id: keys
        run: |
          set -euo pipefail
          anon=$(pnpm exec supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json \
            | node -e 'const k=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write((k.find(x=>x.name==="anon")||{}).api_key||"")')
          test -n "$anon" || { echo "::error::anon key not found"; exit 1; }
          echo "supabase_url=https://${SUPABASE_PROJECT_REF}.supabase.co" >> "$GITHUB_OUTPUT"
          echo "anon_key=$anon" >> "$GITHUB_OUTPUT"
          echo "EXPO_PUBLIC_SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co" >> "$GITHUB_STEP_SUMMARY"

  apk:
    name: Build real-mode APK and publish release
    needs: deploy
    if: ${{ inputs.build_apk }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_USE_MOCKS: 'false'
      EXPO_PUBLIC_SUPABASE_URL: ${{ needs.deploy.outputs.supabase_url }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ needs.deploy.outputs.anon_key }}
      EXPO_NO_TELEMETRY: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      - name: Prebuild Android project
        working-directory: apps/mobile
        run: |
          npx expo prebuild -p android --clean --no-install
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          # The template's 2 GB heap makes D8 (mergeExtDexRelease) run out of memory and hang.
          sed -i '/^org.gradle.jvmargs=/d' android/gradle.properties
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError\n' >> android/gradle.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        timeout-minutes: 45
        # 64-bit only: covers practically every phone from recent years and halves native build time.
        run: ./gradlew assembleRelease --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -nE "s/^\s*version: '([^']+)'.*/\1/p" apps/mobile/app.config.ts | head -1)
          tag="v${version}-real"
          apk="bocado-real-${version}.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          notes="APK de prueba con **IA real** y cuenta en la nube (no es la demo). Android 8+ (64 bits). Firmado con la clave de debug: solo para pruebas. SHA-256: \`${sha}\`. Guía: docs/SEMANA_DE_PRUEBA.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Bocado ${version} (prueba real)" --notes "$notes"
          fi
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${apk}" >> "$GITHUB_STEP_SUMMARY"
