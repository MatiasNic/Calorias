name: Deploy backend + real APK

# Runs scripts/deploy-backend.sh against the Supabase project (GitHub runners can reach Postgres,
# unlike sandboxed environments), then builds a test APK with real AI/backend
# (EXPO_PUBLIC_USE_MOCKS=false) and publishes it as a GitHub Release. See docs/SEMANA_DE_PRUEBA.md.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD, BOCADO_ANTHROPIC_API_KEY
#   optional: USDA_FDC_API_KEY, REVENUECAT_WEBHOOK_SECRET, AI_ALERT_WEBHOOK_URL
#   APK signing (recommended; without them the APK is signed with the public debug key):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   The Play Store bundle (input build_aab) is only built with that key: it is the upload key
#   Play registers on the first upload (see docs/PLAY_STORE.md).
#   Readable crash reports (optional): SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT
# Repository variables (public values baked into the app): REVENUECAT_ANDROID_KEY (RevenueCat
#   public Android key, enables real purchases), SENTRY_DSN, SUPPORT_EMAIL
on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Run migrations, seed, secrets and Edge Functions (off = only read the public keys)'
        type: boolean
        default: true
      build_apk:
        description: 'Also build and publish the real-mode APK'
        type: boolean
        default: true
      minify:
        description: 'Shrink the APK with R8 (test variant, published as …-min.apk)'
        type: boolean
        default: false
      build_aab:
        description: 'Also build the Play Store bundle (.aab). Needs the release keystore secrets'
        type: boolean
        default: false

# Least privilege: only the job that publishes the release can write.
permissions:
  contents: read

# Backend deploys run one at a time; APK-only builds (e.g. regular + R8 variant) run in parallel
# (GitHub keeps a single pending run per group and cancels the others).
concurrency:
  group: ${{ inputs.deploy_backend && 'deploy-backend' || format('apk-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Supabase backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Secrets only reach this step (never `pnpm install`, whose package scripts could read them).
      - name: Deploy (migrations, seed, secrets, Edge Functions)
        if: ${{ inputs.deploy_backend }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BOCADO_ANTHROPIC_API_KEY: ${{ secrets.BOCADO_ANTHROPIC_API_KEY }}
          USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
          REVENUECAT_WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
          REVENUECAT_ACCEPT_SANDBOX: ${{ secrets.REVENUECAT_ACCEPT_SANDBOX }}
          AI_ALERT_WEBHOOK_URL: ${{ secrets.AI_ALERT_WEBHOOK_URL }}
        run: ./scripts/deploy-backend.sh
  apk:
    name: Build real-mode APK / Play bundle and publish release
    needs: deploy
    if: ${{ inputs.build_apk || inputs.build_aab }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      EXPO_PUBLIC_USE_MOCKS: 'false'
      ANDROID_MINIFY: ${{ inputs.minify }}
      BUILD_APK: ${{ inputs.build_apk }}
      BUILD_AAB: ${{ inputs.build_aab }}
      EXPO_NO_TELEMETRY: '1'
      # Public app config, from repository *variables* (Settings → Secrets and variables →
      # Actions → Variables): none of these is secret. Empty = feature off / app default.
      EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ vars.REVENUECAT_ANDROID_KEY }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      # Source maps go to Sentry only when its token is configured (see docs/PENDIENTES.md).
      SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      # Read here, not as outputs of the deploy job: GitHub drops job outputs that contain a
      # secret value (the project ref is one), which silently produced demo-mode APKs.
      - name: Public values for the app (URL and anon key are not secret)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          anon=$(pnpm exec supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json \
            | node -e 'const k=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write((k.find(x=>x.name==="anon")||{}).api_key||"")')
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::SUPABASE_PROJECT_REF missing"; exit 1; }
          test -n "$anon" || { echo "::error::anon key not found"; exit 1; }
          echo "EXPO_PUBLIC_SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$anon" >> "$GITHUB_ENV"
      - name: Prebuild Android project
        working-directory: apps/mobile
        run: |
          npx expo prebuild -p android --clean --no-install
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          # The template's 2 GB heap makes D8 (mergeExtDexRelease) run out of memory and hang.
          sed -i '/^org.gradle.jvmargs=/d' android/gradle.properties
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError\n' >> android/gradle.properties
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Gradle release build
        working-directory: apps/mobile/android
        timeout-minutes: 55
        # Test APK: 64-bit only (practically every recent phone; halves native build time).
        # Play bundle: 32-bit ARM too, so the store also offers the app to older low-end phones.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signing=()
          if [ -n "${KEYSTORE_B64:-}" ]; then
            # Private release key (the template's debug key is public: anyone could sign an
            # "update" of the app with it). Written to the runner's temp dir, never committed.
            ks="$RUNNER_TEMP/release.keystore"
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            signing=(
              "-Pandroid.injected.signing.store.file=$ks"
              "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
            )
            echo "SIGNED_WITH=release" >> "$GITHUB_ENV"
          else
            if [ "$BUILD_AAB" = true ]; then
              echo "::error::The Play bundle needs the release keystore secrets (docs/PLAY_STORE.md)"
              exit 1
            fi
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set: the APK is signed with the public debug key"
            echo "SIGNED_WITH=debug" >> "$GITHUB_ENV"
          fi
          tasks=()
          abis=arm64-v8a
          if [ "$BUILD_APK" = true ]; then tasks+=(assembleRelease); fi
          if [ "$BUILD_AAB" = true ]; then
            tasks+=(bundleRelease)
            abis=arm64-v8a,armeabi-v7a
          fi
          ./gradlew "${tasks[@]}" --no-daemon --console=plain "-PreactNativeArchitectures=$abis" "${signing[@]}"
          rm -f "$RUNNER_TEMP/release.keystore"
      - name: Check the build talks to the real backend
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          out=apps/mobile/android/app/build/outputs
          check() {
            unzip -p "$1" "$2" > /tmp/bundle
            if ! grep -aq "${SUPABASE_PROJECT_REF}.supabase.co" /tmp/bundle; then
              echo "::error::The JS bundle in $1 has no Supabase URL: it would run in demo mode"
              exit 1
            fi
          }
          if [ "$BUILD_APK" = true ]; then
            check "$out/apk/release/app-release.apk" assets/index.android.bundle
          fi
          if [ "$BUILD_AAB" = true ]; then
            check "$out/bundle/release/app-release.aab" base/assets/index.android.bundle
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -nE "s/^\s*version: '([^']+)'.*/\1/p" apps/mobile/app.config.ts | head -1)
          tag="v${version}-real"
          suffix=""
          if [ "$ANDROID_MINIFY" = true ]; then suffix="-min"; fi
          out=apps/mobile/android/app/build/outputs
          files=()
          notes="Build con **IA real** y cuenta en la nube (no es la demo)."
          if [ "$BUILD_APK" = true ]; then
            apk="bocado-real-${version}${suffix}.apk"
            cp "$out/apk/release/app-release.apk" "$apk"
            files+=("$apk")
            sha=$(sha256sum "$apk" | cut -d' ' -f1)
            notes="APK de prueba con **IA real** y cuenta en la nube (no es la demo). Android 8+ (64 bits). $( [ "$SIGNED_WITH" = release ] && echo 'Firmado con la clave de release.' || echo 'Firmado con la clave de debug: solo para pruebas.' ) SHA-256: \`${sha}\`. Guía: docs/SEMANA_DE_PRUEBA.md"
          fi
          if [ "$BUILD_AAB" = true ]; then
            # The file to upload in Play Console (it cannot be installed on a phone directly).
            aab="bocado-play-${version}${suffix}.aab"
            cp "$out/bundle/release/app-release.aab" "$aab"
            files+=("$aab")
            notes="$notes El archivo \`.aab\` es el que se sube a Play Console (docs/PLAY_STORE.md)."
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            # The R8 test variant joins the release without replacing the notes of the main APK.
            if [ "$ANDROID_MINIFY" != true ] && [ "$BUILD_APK" = true ]; then
              gh release edit "$tag" --notes "$notes"
            fi
          else
            create() {
              gh release create "$tag" "${files[@]}" "$@" --prerelease --latest=false \
                --title "Bocado ${version} (prueba real)" --notes "$notes"
            }
            # The workflow token may not create a tag on a commit that changes workflow files
            # (HTTP 403): the release then gets its tag on the default branch instead.
            create --target "$GITHUB_SHA" || create
          fi
          for f in "${files[@]}"; do
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${f}" >> "$GITHUB_STEP_SUMMARY"
          done
