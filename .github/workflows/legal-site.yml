name: Publish legal site

# Publishes web/legal (privacy policy, terms, account deletion: the public URLs Play Console asks
# for) to GitHub Pages. One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# See docs/PLAY_STORE.md.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/legal/**', 'scripts/build-legal-site.mjs']

permissions:
  contents: read

concurrency:
  group: legal-site
  cancel-in-progress: true

jobs:
  publish:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # Fails while web/legal/site.config.json still has empty fields (owner, email, …).
      - run: node scripts/build-legal-site.mjs _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
